<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 가족 마음일기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        
        .font-hand { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; font-weight: 500; }
        .font-sans-kr { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .active-tab { background-color: #FEF3C7; color: #D97706; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-click-effect:active {
            transform: scale(0.97);
            background-color: #EA580C !important;
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-pink-50 to-indigo-50 min-h-screen font-sans-kr text-slate-800 pb-12">
    <div class="max-w-2xl mx-auto px-4 pt-6">
        
        <div id="view-login" class="fade-in max-w-md mx-auto mt-12 bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-amber-100 text-center">
            <div class="text-4xl mb-4">🏡</div>
            <h2 class="text-2xl font-bold text-amber-600 font-hand text-3xl mb-1">우리 가족 마음일기</h2>
            <p class="text-xs text-slate-400 mb-8">누구인지 선택하고 비밀번호를 입력해 주세요.</p>
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button type="button" id="btn-user-hanul" class="p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-amber-50 transition-all flex flex-col items-center">
                    <span class="text-3xl mb-1">👦</span><span class="text-sm font-bold text-slate-600">한울이</span>
                </button>
                <button type="button" id="btn-user-yeoul" class="p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-pink-50 transition-all flex flex-col items-center">
                    <span class="text-3xl mb-1">👧</span><span class="text-sm font-bold text-slate-600">여울이</span>
                </button>
                <button type="button" id="btn-user-parents" class="p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-indigo-50 transition-all flex flex-col items-center">
                    <span class="text-3xl mb-1">👩‍👨</span><span class="text-sm font-bold text-slate-600">엄마아빠</span>
                </button>
            </div>
            <div id="password-area" class="hidden fade-in">
                <input type="number" pattern="[0-9]*" inputmode="numeric" id="login-password" placeholder="비밀번호 4자리 입력" class="w-full p-3 text-center text-lg font-bold tracking-widest rounded-xl border border-slate-200 mb-4 focus:outline-none focus:ring-2 focus:ring-amber-300" maxlength="4">
                <button type="button" id="btn-submit-login" class="w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-md btn-click-effect transition-all text-base">입장하기 🔑</button>
            </div>
        </div>

        <div id="main-app" class="hidden">
            <header class="text-center mb-6 relative">
                <button id="btn-logout" class="absolute left-0 top-3 text-xs bg-slate-200/80 px-3 py-1.5 rounded-full font-bold text-slate-600">🔒 로그아웃</button>
                <div class="inline-flex items-center gap-2 bg-white/80 backdrop-blur-md px-6 py-3 rounded-full shadow-sm border border-amber-100/50 mb-3">
                    <span class="text-2xl" id="header-avatar">☁️</span>
                    <h1 class="text-2xl md:text-3xl font-bold text-amber-600 font-hand" id="header-title">마음일기</h1>
                    <span id="sync-status" class="w-2.5 h-2.5 rounded-full bg-emerald-500 ml-1"></span>
                </div>
                <p class="text-xs text-slate-500 font-hand text-lg" id="header-subtitle">소중한 마음을 기록하는 공간</p>
            </header>

            <nav class="flex justify-between bg-white/60 p-1.5 rounded-2xl border mb-6 gap-1">
                <button id="tab-write" class="flex-1 py-3 text-sm font-bold rounded-xl active-tab">✏️ <span id="nav-write-text">일기 쓰기</span></button>
                <button id="tab-history" class="flex-1 py-3 text-sm font-bold rounded-xl text-slate-500 hover:bg-white/40">📚 <span>우리 방 일기</span></button>
                <button id="tab-parents" class="flex-1 py-3 text-sm font-bold rounded-xl text-slate-500 hover:bg-white/40 relative">
                    <span>💌</span> <span id="nav-parents-text">엄빠 우체통</span>
                    <span id="badge-count" class="hidden absolute top-1 right-2 bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
                </button>
            </nav>

            <main id="view-write" class="fade-in">
                <div id="write-start-screen" class="bg-white/90 p-8 rounded-3xl border text-center">
                    <div class="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6 animate-bounce"><span class="text-5xl">📖</span></div>
                    <h2 class="text-2xl font-bold text-slate-700 mb-2 font-hand text-3xl" id="welcome-title">오늘 하루는 어땠어?</h2>
                    <p class="text-slate-500 mb-8 text-sm">오늘 하루 속 소중한 마음들을<br>엄마 아빠와 함께 나누어 보자!</p>
                    <button id="btn-start-diary" class="px-8 py-4 bg-orange-500 text-white font-bold text-lg rounded-2xl shadow-md btn-click-effect">마음 일기장 펼치기 ✨</button>
                </div>
                <div id="write-wizard" class="hidden bg-white/90 p-6 md:p-8 rounded-3xl border shadow-md">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-2xl" id="step-icon">🤖</div>
                            <div>
                                <span class="text-xs text-indigo-500 font-bold block" id="step-label">STEP 1</span>
                                <h3 class="text-base font-bold text-slate-700" id="step-title">질문</h3>
                            </div>
                        </div>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-6"><div id="progress-bar" class="bg-gradient-to-r from-amber-400 to-indigo-400 h-full" style="width: 10%"></div></div>
                    <div class="mb-8 min-h-[140px] flex flex-col justify-center">
                        <p id="step-helper" class="text-slate-500 text-sm mb-3 italic font-hand text-lg text-amber-600/80"></p>
                        <div id="step-input-container"></div>
                    </div>
                    <div class="flex justify-between items-center gap-4">
                        <button id="btn-prev" class="px-6 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-xl">이전</button>
                        <button id="btn-next" class="flex-1 px-6 py-3.5 bg-orange-500 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 btn-click-effect"><span id="btn-next-text">다음</span>👉</button>
                    </div>
                </div>
            </main>

            <main id="view-history" class="hidden fade-in">
                <div id="history-filter-area" class="hidden mb-4 flex gap-1.5 bg-white/50 p-1 rounded-xl border">
                    <button id="btn-hist-filter-all" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-100 text-amber-700 shadow-sm transition-all">전체 보기</button>
                    <button id="btn-hist-filter-hanul" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-white/50 transition-all">👦 한울이</button>
                    <button id="btn-hist-filter-yeoul" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-white/50 transition-all">👧 여울이</button>
                </div>
                <div id="diary-list" class="space-y-4"></div>
                <div id="history-empty" class="hidden bg-white/80 p-12 rounded-3xl border text-center"><span class="text-5xl block mb-4">📭</span><p class="text-slate-500 font-hand text-xl">아직 등록된 마음일기가 없어요.</p></div>
            </main>

            <main id="view-parents" class="hidden fade-in">
                <div id="parents-zone-info" class="bg-gradient-to-r from-rose-50 to-pink-50 border p-5 rounded-2xl mb-4 shadow-sm">
                    <h3 class="font-bold text-rose-700 font-hand text-xl">👩‍👨 엄마 아빠 사랑의 우체통</h3>
                    <p class="text-xs text-rose-600 mt-1">아이들이 보낸 편지에 엄마, 아빠가 각각 하트와 따뜻한 답장을 따로 남겨줄 수 있어요!</p>
                </div>
                <div id="parents-filter-area" class="hidden mb-4 flex gap-1.5 bg-white/50 p-1 rounded-xl border">
                    <button id="btn-parent-filter-all" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-100 text-amber-700 shadow-sm transition-all">전체 보기</button>
                    <button id="btn-parent-filter-hanul" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-white/50 transition-all">👦 한울이</button>
                    <button id="btn-parent-filter-yeoul" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-white/50 transition-all">👧 여울이</button>
                </div>
                <div id="parents-mail-list" class="space-y-4"></div>
                <div id="parents-empty" class="hidden bg-white/80 p-12 rounded-3xl border text-center"><span class="text-5xl block mb-4">📬</span><p class="text-slate-500 font-hand text-xl">아직 배달된 편지가 없어요.</p></div>
            </main>
        </div>
    </div>

    <div id="diary-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg max-h-[85vh] overflow-y-auto border fade-in">
            <div class="p-5 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <div class="flex items-center gap-2"><span id="modal-mood-icon" class="text-3xl">😊</span><h3 id="modal-date" class="font-bold text-slate-800">날짜</h3></div>
                <button id="btn-close-modal" class="text-slate-400 p-1 bg-slate-100 rounded-full">❌</button>
            </div>
            <div class="p-6 space-y-4" id="modal-content-area"></div>
            <div class="p-5 bg-slate-50 border-t flex gap-2"><button id="btn-delete-diary" class="w-full py-2.5 bg-rose-50 text-rose-600 font-bold rounded-xl text-sm">🗑️ 일기장 삭제</button></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3.5 rounded-2xl shadow-lg z-50 text-sm font-semibold opacity-0 pointer-events-none transition-all duration-300">✨ <span id="toast-msg">알림</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ── Firebase 설정 ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyCRdoiujidOfHG8pwn_EOoMC2UFzU190-w",
            authDomain: "hanul-heart-diary.firebaseapp.com",
            projectId: "hanul-heart-diary",
            storageBucket: "hanul-heart-diary.firebasestorage.app",
            messagingSenderId: "313053846900",
            appId: "1:313053846900:web:bd6bb5d79e6bea468ca021"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ── 상태 변수 ──────────────────────────────────────────────
        const FAMILY_PASSWORDS = { hanul: "1112", yeoul: "1342", parents: "7070" };
        let diaries = [];
        let currentStep = 0;
        let selectedLoginUser = null;
        let currentUserRole = null;
        let draftDiary = {};
        let selectedDiaryId = null;
        let historyFilter = 'all';
        let parentsFilter = 'all';

        const steps = [
            { label: '기분 선택', title: '오늘 나의 기분은 어때?', icon: '🌈', helper: '대표 기분을 골라봐!', type: 'mood' },
            { label: '기쁜 순간', title: '1. 오늘 재미있거나 좋은 일이 있었나요?', icon: '☀️', helper: '나를 웃게 만든 최고의 순간은?', placeholder: '축구 경기 이겨서 좋았어요!', key: 'q1', type: 'textarea' },
            { label: '학교 생활', title: '2. 학교에서 쉬는 시간, 점심 시간에 어떻게 지냈나요?', icon: '🏫', helper: '학교에서 있었던 재미난 일은?', placeholder: '친구들이랑 잡기놀이 했어요.', key: 'q2', type: 'textarea' },
            { label: '속상한 순간', title: '3. 기분이 상하거나 속상한 일이 있었나요?', icon: '😢', helper: '훌훌 털어놓고 싶은 아쉬운 순간은?', placeholder: '비가 와서 신발이 조금 젖었어요.', key: 'q3', type: 'textarea' },
            { label: '학원과 운동', title: '4. 학원이나 복싱에서는 어땠나요?', icon: '🥊', helper: '땀 흘리며 열정적으로 운동한 이야기는?', placeholder: '복싱장에서 잽 연습 열심히 했어요!', key: 'q4', type: 'textarea' },
            { label: '엄빠 소통', title: '5. 엄마, 아빠에게 전하고 싶은 얘기가 있나요?', icon: '💌', helper: '엄빠에게 전하는 따뜻한 메시지', placeholder: '엄마 아빠 사랑해요!', key: 'q5', type: 'textarea' }
        ];
        const moods = [
            { icon: '😃', text: '신나요' }, { icon: '🥰', text: '행복해요' },
            { icon: '🥱', text: '피곤해요' }, { icon: '😢', text: '속상해요' }, { icon: '😡', text: '화나요' }
        ];

        // ── 토스트 ─────────────────────────────────────────────────
        function showToast(emoji, msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.querySelector('span').innerText = msg;
            t.style.opacity = '1';
            t.innerHTML = `${emoji} <span>${msg}</span>`;
            setTimeout(() => { t.style.opacity = '0'; }, 2500);
        }

        // ── Firebase 초기화 & 실시간 리스닝 ──────────────────────
        let authReady = false;
        signInAnonymously(auth).catch(err => console.error('Auth error:', err));
        onAuthStateChanged(auth, (user) => {
            authReady = !!user;
            document.getElementById('sync-status').style.backgroundColor = authReady ? '#10b981' : '#f59e0b';
        });

        onSnapshot(collection(db, 'diaries'), (snapshot) => {
            const fetched = [];
            snapshot.forEach(d => fetched.push({ id: d.id, ...d.data() }));
            fetched.sort((a, b) => b.id.localeCompare(a.id));
            diaries = fetched;
            if (currentUserRole) {
                renderHistoryTab();
                renderParentsTab();
                updateUnreadParentsBadge();
            }
        });

        // ── 로그인 ─────────────────────────────────────────────────
        function selectLoginUser(userRole) {
            selectedLoginUser = userRole;
            ['hanul', 'yeoul', 'parents'].forEach(r => {
                const btn = document.getElementById(`btn-user-${r}`);
                btn.classList.remove('border-amber-400', 'bg-amber-50');
                btn.classList.add('border-slate-100', 'bg-slate-50');
            });
            const sel = document.getElementById(`btn-user-${userRole}`);
            sel.classList.remove('border-slate-100', 'bg-slate-50');
            sel.classList.add('border-amber-400', 'bg-amber-50');
            document.getElementById('password-area').classList.remove('hidden');
            document.getElementById('login-password').value = '';
            setTimeout(() => document.getElementById('login-password').focus(), 100);
        }

        function checkPassword() {
            const passInput = document.getElementById('login-password').value.trim();
            if (!selectedLoginUser) {
                showToast('⚠️', '사용자를 먼저 선택해 주세요!');
                return;
            }
            if (FAMILY_PASSWORDS[selectedLoginUser] === passInput) {
                currentUserRole = selectedLoginUser;
                showToast('🔑', '반갑습니다! 입장 성공!');
                enterMainApp();
            } else {
                showToast('❌', '비밀번호가 다릅니다!');
                document.getElementById('login-password').value = '';
                document.getElementById('login-password').focus();
            }
        }

        function enterMainApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            const titleMap = { hanul: "한울이의 마음일기", yeoul: "여울이의 마음일기", parents: "엄마아빠 우체통" };
            const welcomeMap = { hanul: "한울아, 안녕! 오늘 하루는 어땠어?", yeoul: "여울아, 안녕! 오늘 하루는 어땠어?", parents: "아이들의 일기를 확인해 보세요" };
            document.getElementById('header-title').innerText = titleMap[currentUserRole];
            document.getElementById('welcome-title').innerText = welcomeMap[currentUserRole];
            document.getElementById('header-avatar').innerText = currentUserRole === 'parents' ? '👩‍👨' : (currentUserRole === 'hanul' ? '👦' : '👧');
            
            if (currentUserRole === 'parents') {
                document.getElementById('nav-write-text').innerText = "안내 대문";
                document.getElementById('nav-parents-text').innerText = "아이들 우체통";
                document.getElementById('history-filter-area').classList.remove('hidden');
                document.getElementById('parents-filter-area').classList.remove('hidden');
                historyFilter = 'all';
                parentsFilter = 'all';
                updateFilterButtons();
                switchTab('parents');
            } else {
                document.getElementById('nav-write-text').innerText = "일기 쓰기";
                document.getElementById('nav-parents-text').innerText = "나의 우체통 반응";
                document.getElementById('history-filter-area').classList.add('hidden');
                document.getElementById('parents-filter-area').classList.add('hidden');
                switchTab('write');
            }
        }

        function logout() {
            currentUserRole = null;
            selectedLoginUser = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('password-area').classList.add('hidden');
            ['hanul', 'yeoul', 'parents'].forEach(r => {
                const btn = document.getElementById(`btn-user-${r}`);
                btn.classList.remove('border-amber-400', 'bg-amber-50');
                btn.classList.add('border-slate-100', 'bg-slate-50');
            });
        }

        function updateFilterButtons() {
            ['all', 'hanul', 'yeoul'].forEach(f => {
                const btnHist = document.getElementById(`btn-hist-filter-${f}`);
                if (btnHist) {
                    if (historyFilter === f) {
                        btnHist.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-100 text-amber-700 shadow-sm transition-all";
                    } else {
                        btnHist.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-white/50 transition-all";
                    }
                }
                const btnParent = document.getElementById(`btn-parent-filter-${f}`);
                if (btnParent) {
                    if (parentsFilter === f) {
                        btnParent.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-100 text-amber-700 shadow-sm transition-all";
                    } else {
                        btnParent.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-white/50 transition-all";
                    }
                }
            });
        }

        function switchTab(tabId) {
            ['write', 'history', 'parents'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active-tab');
                document.getElementById(`tab-${t}`).classList.add('text-slate-500');
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active-tab');
            document.getElementById(`tab-${tabId}`).classList.remove('text-slate-500');
            if (tabId === 'history') renderHistoryTab();
            if (tabId === 'parents') renderParentsTab();
        }

        // ── 일기 작성 ──────────────────────────────────────────────
        function startDiaryFlow() {
            if (currentUserRole === 'parents') return;
            currentStep = 0;
            const today = new Date();
            const formattedDate = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;
            draftDiary = {
                id: `diary_${currentUserRole}_${Date.now()}`,
                writer: currentUserRole,
                date: formattedDate,
                mood: '😃',
                q1: '', q2: '', q3: '', q4: '', q5: '',
                momLove: false, momReply: '', dadLove: false, dadReply: ''
            };
            document.getElementById('write-start-screen').classList.add('hidden');
            document.getElementById('write-wizard').classList.remove('hidden');
            renderStep();
        }

        function renderStep() {
            const step = steps[currentStep];
            document.getElementById('step-icon').innerText = step.icon;
            document.getElementById('step-label').innerText = `STEP ${currentStep + 1} / ${steps.length}`;
            document.getElementById('step-title').innerText = step.title;
            document.getElementById('step-helper').innerText = step.helper;
            document.getElementById('progress-bar').style.width = `${((currentStep + 1) / steps.length) * 100}%`;
            document.getElementById('btn-prev').classList.toggle('invisible', currentStep === 0);
            document.getElementById('btn-next-text').innerText = (currentStep === steps.length - 1) ? '일기 완성하기' : '다음으로';

            const container = document.getElementById('step-input-container');
            container.innerHTML = '';

            if (step.type === 'mood') {
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-5 gap-2 max-w-md mx-auto';
                moods.forEach(m => {
                    const isSel = draftDiary.mood === m.icon;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `flex flex-col items-center p-3 rounded-2xl border-2 transition-all ${isSel ? 'border-amber-400 bg-amber-50' : 'border-slate-100 bg-slate-50'}`;
                    btn.innerHTML = `<span class="text-2xl mb-1">${m.icon}</span><span class="text-[10px] font-bold">${m.text}</span>`;
                    btn.addEventListener('click', () => { draftDiary.mood = m.icon; renderStep(); });
                    grid.appendChild(btn);
                });
                container.appendChild(grid);
            } else {
                const tx = document.createElement('textarea');
                tx.className = 'w-full min-h-[120px] p-4 rounded-2xl border focus:ring-2 focus:ring-amber-300 text-sm resize-none focus:outline-none';
                tx.placeholder = `예시) ${step.placeholder}`;
                tx.value = draftDiary[step.key] || '';
                tx.addEventListener('input', (e) => { draftDiary[step.key] = e.target.value; });
                container.appendChild(tx);
                tx.focus();
            }
        }

        async function nextStep() {
            const step = steps[currentStep];
            if (step.type === 'textarea' && step.key && !(draftDiary[step.key] || '').trim()) {
                draftDiary[step.key] = '무탈하게 하루를 보냈어요 🍀';
            }
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep();
                return;
            }

            const btnNext = document.getElementById('btn-next');
            btnNext.disabled = true;
            btnNext.innerHTML = '저장 중... ⏳';

            setDoc(doc(db, 'diaries', draftDiary.id), {
                id: draftDiary.id,
                writer: draftDiary.writer,
                date: draftDiary.date,
                mood: draftDiary.mood,
                q1: draftDiary.q1 || '',
                q2: draftDiary.q2 || '',
                q3: draftDiary.q3 || '',
                q4: draftDiary.q4 || '',
                q5: draftDiary.q5 || '',
                momLove: false,
                momReply: '',
                dadLove: false,
                dadReply: ''
            }).then(function() {
                showToast('🎉', '일기가 저장되었습니다!');
                document.getElementById('write-wizard').classList.add('hidden');
                document.getElementById('write-start-screen').classList.remove('hidden');
                document.getElementById('btn-next').disabled = false;
                document.getElementById('btn-next').innerHTML = '<span id="btn-next-text">다음으로</span>👉';
                switchTab('history');
            }).catch(function(e) {
                console.error(e);
                showToast('❌', '저장 실패, 다시 눌러주세요');
                document.getElementById('btn-next').disabled = false;
                document.getElementById('btn-next').innerHTML = '<span id="btn-next-text">일기 완성하기</span>👉';
            });
        }

        function prevStep() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        }

        // ── 히스토리 탭 렌더링 ─────────────────────────────────────
        function renderHistoryTab() {
            const container = document.getElementById('diary-list');
            const empty = document.getElementById('history-empty');
            
            let myDiaries = diaries.filter(d => (currentUserRole === 'parents') || (d.writer === currentUserRole));
            
            if (currentUserRole === 'parents' && historyFilter !== 'all') {
                myDiaries = myDiaries.filter(d => d.writer === historyFilter);
            }
            
            if (myDiaries.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            container.innerHTML = '';
            myDiaries.forEach(d => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl border flex justify-between items-center cursor-pointer hover:shadow-sm transition-all';
                const tag = d.writer === 'hanul' ? '👦 한울' : '👧 여울';
                
                // 엄마나 아빠 중 누구라도 반응을 남기면 '사랑 도착' 배지 생성
                const badge = (d.momLove || d.momReply || d.dadLove || d.dadReply) ? `<span class="text-rose-500 font-bold text-xs ml-2">💖 사랑 도착</span>` : '';
                
                card.innerHTML = `<div class="flex items-center gap-3">
                    <div class="text-2xl">${d.mood}</div>
                    <div>
                        <div class="flex items-center text-xs font-bold text-slate-500">
                            <span>[${tag}]</span><span class="ml-2">${d.date}</span>${badge}
                        </div>
                        <p class="text-slate-400 text-xs truncate mt-0.5 max-w-[200px]">${d.q1 || ''}</p>
                    </div>
                </div><span>👉</span>`;
                card.addEventListener('click', () => openDiaryDetails(d.id));
                container.appendChild(card);
            });
        }

        // ── 우체통 탭 렌더링 (엄마/아빠 각각의 독립 폼 구성) ────────────────
        function renderParentsTab() {
            const container = document.getElementById('parents-mail-list');
            const empty = document.getElementById('parents-empty');
            
            let targetMails = diaries.filter(d => (currentUserRole === 'parents') || (d.writer === currentUserRole));
            
            if (currentUserRole === 'parents' && parentsFilter !== 'all') {
                targetMails = targetMails.filter(d => d.writer === parentsFilter);
            }
            
            if (targetMails.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            container.innerHTML = '';
            
            targetMails.forEach(d => {
                const card = document.createElement('div');
                // 엄마와 아빠 모두 확인하지 않은 순수 새 글일 때만 테두리 강조
                const isUnread = !d.momLove && !d.momReply && !d.dadLove && !d.dadReply;
                card.className = `p-4 rounded-2xl border bg-white ${isUnread ? 'ring-1 ring-rose-100' : ''}`;
                
                const lbl = d.writer === 'hanul' ? '👦 한울이' : '👧 여울이';
                
                let momSection = '';
                let dadSection = '';
                
                if (currentUserRole === 'parents') {
                    // 엄마 답장 영역 제어
                    if (!d.momReply && !d.momLove) {
                        momSection = `<div class="flex gap-2 items-center mt-1">
                            <button data-id="${d.id}" class="btn-mom-love px-2.5 py-1.5 bg-pink-50 text-pink-600 rounded-lg text-xs font-bold shrink-0">❤️ 하트</button>
                            <input type="text" id="mom-reply-${d.id}" placeholder="엄마의 사랑 가득 답장..." class="flex-1 px-3 py-1.5 text-xs border rounded-lg focus:outline-none">
                            <button data-id="${d.id}" class="btn-mom-send px-3 py-1.5 bg-pink-500 text-white rounded-lg text-xs font-bold shrink-0">보내기</button>
                        </div>`;
                    } else {
                        momSection = `<div class="bg-pink-50/40 p-2.5 rounded-lg text-xs font-bold text-pink-700 flex justify-between items-center mt-1">
                            <span>💝 엄마: ${d.momLove ? '❤️ ' : ''} "${d.momReply || '하트'}"</span>
                            <button data-id="${d.id}" class="btn-mom-reset text-[10px] text-slate-400 underline ml-2 shrink-0">수정</button>
                        </div>`;
                    }

                    // 아빠 답장 영역 제어
                    if (!d.dadReply && !d.dadLove) {
                        dadSection = `<div class="flex gap-2 items-center mt-1">
                            <button data-id="${d.id}" class="btn-dad-love px-2.5 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold shrink-0">❤️ 하트</button>
                            <input type="text" id="dad-reply-${d.id}" placeholder="아빠의 든든한 응원 답장..." class="flex-1 px-3 py-1.5 text-xs border rounded-lg focus:outline-none">
                            <button data-id="${d.id}" class="btn-dad-send px-3 py-1.5 bg-indigo-500 text-white rounded-lg text-xs font-bold shrink-0">보내기</button>
                        </div>`;
                    } else {
                        dadSection = `<div class="bg-indigo-50/40 p-2.5 rounded-lg text-xs font-bold text-indigo-700 flex justify-between items-center mt-1">
                            <span>💝 아빠: ${d.dadLove ? '❤️ ' : ''} "${d.dadReply || '하트'}"</span>
                            <button data-id="${d.id}" class="btn-dad-reset text-[10px] text-slate-400 underline ml-2 shrink-0">수정</button>
                        </div>`;
                    }
                } else {
                    // 아이들 시점 화면 노출
                    momSection = `<div class="text-xs ${d.momLove || d.momReply ? 'text-pink-600 font-bold' : 'text-slate-400 italic'} mt-1">
                        ${d.momLove || d.momReply ? `💝 엄마: ${d.momLove ? '❤️ ' : ''} "${d.momReply || '하트'}"` : '⏳ 엄마는 아직 읽는 중이에요!'}
                    </div>`;
                    dadSection = `<div class="text-xs ${d.dadLove || d.dadReply ? 'text-indigo-600 font-bold' : 'text-slate-400 italic'} mt-1">
                        ${d.dadLove || d.dadReply ? `💝 아빠: ${d.dadLove ? '❤️ ' : ''} "${d.dadReply || '하트'}"` : '⏳ 아빠는 아직 읽는 중이에요!'}
                    </div>`;
                }
                
                card.innerHTML = `<div class="flex justify-between items-center mb-1.5">
                    <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">${lbl}의 쪽지</span>
                    <span class="text-slate-400 text-[11px]">${d.date}</span>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl font-hand text-base text-slate-700 shadow-inner mb-3">${d.q5 || '사랑해요!'}</div>
                
                <div class="mt-3 pt-3 border-t border-dashed space-y-3">
                    <div>
                        <span class="text-[10px] font-bold text-pink-400 block">👩 엄마의 마음</span>
                        ${momSection}
                    </div>
                    <div class="pt-2 border-t border-slate-100">
                        <span class="text-[10px] font-bold text-indigo-400 block">👨 아빠의 마음</span>
                        ${dadSection}
                    </div>
                </div>`;
                
                container.appendChild(card);
            });

            // 엄마 동적 이벤트 바인딩
            container.querySelectorAll('.btn-mom-love').forEach(btn => btn.addEventListener('click', () => sendMomLove(btn.dataset.id)));
            container.querySelectorAll('.btn-mom-send').forEach(btn => btn.addEventListener('click', () => sendMomReply(btn.dataset.id)));
            container.querySelectorAll('.btn-mom-reset').forEach(btn => btn.addEventListener('click', () => resetMomReply(btn.dataset.id)));

            // 아빠 동적 이벤트 바인딩
            container.querySelectorAll('.btn-dad-love').forEach(btn => btn.addEventListener('click', () => sendDadLove(btn.dataset.id)));
            container.querySelectorAll('.btn-dad-send').forEach(btn => btn.addEventListener('click', () => sendDadReply(btn.dataset.id)));
            container.querySelectorAll('.btn-dad-reset').forEach(btn => btn.addEventListener('click', () => resetDadReply(btn.dataset.id)));
        }

        // ── 엄마/아빠 개별 통신 비즈니스 로직 ───────────────────────
        async function sendMomLove(id) {
            await updateDoc(doc(db, 'diaries', id), { momLove: true });
            showToast('❤️', '엄마 하트 전송!');
        }
        async function sendMomReply(id) {
            const v = document.getElementById(`mom-reply-${id}`).value;
            if (!v.trim()) return;
            await updateDoc(doc(db, 'diaries', id), { momReply: v.trim(), momLove: true });
            showToast('💌', '엄마 답장 완료!');
        }
        async function resetMomReply(id) {
            await updateDoc(doc(db, 'diaries', id), { momReply: '', momLove: false });
        }

        async function sendDadLove(id) {
            await updateDoc(doc(db, 'diaries', id), { dadLove: true });
            showToast('❤️', '아빠 하트 전송!');
        }
        async function sendDadReply(id) {
            const v = document.getElementById(`dad-reply-${id}`).value;
            if (!v.trim()) return;
            await updateDoc(doc(db, 'diaries', id), { dadReply: v.trim(), dadLove: true });
            showToast('💌', '아빠 답장 완료!');
        }
        async function resetDadReply(id) {
            await updateDoc(doc(db, 'diaries', id), { dadReply: '', dadLove: false });
        }

        // ── 일기 상세 모달 ─────────────────────────────────────────
        function openDiaryDetails(id) {
            selectedDiaryId = id;
            const d = diaries.find(item => item.id === id);
            if (!d) return;
            document.getElementById('modal-mood-icon').innerText = d.mood;
            document.getElementById('modal-date').innerText = d.date;
            const area = document.getElementById('modal-content-area');
            area.innerHTML = '';
            const items = [
                { t: '☀️ 좋은 일', v: d.q1 }, { t: '🏫 학교 생활', v: d.q2 },
                { t: '😢 속상한 일', v: d.q3 }, { t: '🥊 학원/운동', v: d.q4 }, { t: '💌 엄빠 쪽지', v: d.q5 }
            ];
            items.forEach(it => {
                const div = document.createElement('div');
                div.className = 'bg-slate-50 p-3 rounded-xl';
                div.innerHTML = `<h4 class="text-[11px] font-bold text-slate-400 mb-0.5">${it.t}</h4><p class="text-slate-800 font-hand text-base">${it.v || '없음'}</p>`;
                area.appendChild(div);
            });
            document.getElementById('diary-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('diary-modal').classList.add('hidden');
        }

        async function deleteCurrentDiary() {
            if (!selectedDiaryId) return;
            if (confirm('이 일기를 정말 삭제하시겠습니까?')) {
                await deleteDoc(doc(db, 'diaries', selectedDiaryId));
                closeModal();
                showToast('🗑️', '삭제 완료');
            }
        }

        function updateUnreadParentsBadge() {
            // 엄마 아빠 둘 다 아무 피드백도 남기지 않은 글만 카운트 배지 알림
            const count = diaries.filter(d => !d.momLove && !d.momReply && !d.dadLove && !d.dadReply).length;
            const b = document.getElementById('badge-count');
            if (count > 0 && currentUserRole === 'parents') {
                b.innerText = count;
                b.classList.remove('hidden');
            } else {
                b.classList.add('hidden');
            }
        }

        // ── 이벤트 바인딩 ─────────────────────────────────────────
        document.getElementById('btn-user-hanul').addEventListener('click', () => selectLoginUser('hanul'));
        document.getElementById('btn-user-yeoul').addEventListener('click', () => selectLoginUser('yeoul'));
        document.getElementById('btn-user-parents').addEventListener('click', () => selectLoginUser('parents'));
        document.getElementById('btn-submit-login').addEventListener('click', checkPassword);
        document.getElementById('login-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
        document.getElementById('btn-logout').addEventListener('click', logout);
        document.getElementById('tab-write').addEventListener('click', () => switchTab('write'));
        document.getElementById('tab-history').addEventListener('click', () => switchTab('history'));
        document.getElementById('tab-parents').addEventListener('click', () => switchTab('parents'));
        document.getElementById('btn-start-diary').addEventListener('click', startDiaryFlow);
        document.getElementById('btn-prev').addEventListener('click', prevStep);
        document.getElementById('btn-next').addEventListener('click', nextStep);
        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('btn-delete-diary').addEventListener('click', deleteCurrentDiary);

        ['all', 'hanul', 'yeoul'].forEach(f => {
            document.getElementById(`btn-hist-filter-${f}`).addEventListener('click', () => {
                historyFilter = f;
                updateFilterButtons();
                renderHistoryTab();
            });
            document.getElementById(`btn-parent-filter-${f}`).addEventListener('click', () => {
                parentsFilter = f;
                updateFilterButtons();
                renderParentsTab();
            });
        });

    </script>
</body>
</html>
